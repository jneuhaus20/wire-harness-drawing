name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get install -y graphviz
      - run: pip install pyyaml cairosvg pypdf wireviz==0.4.1
      - run: python -m unittest

  # The repository installs as a Claude Code plugin marketplace: check its manifests as Claude Code does.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .

  # The tests need Python 3.11, but the skill itself supports 3.10: generate the example there.
  oldest-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pyyaml
      - run: python skills/wire-harness-drawing/scripts/harnessgen.py examples/sensor-branch/sensor-branch.yaml -o out --no-wireviz
      - run: diff out/sensor-branch.bom.csv examples/sensor-branch/sensor-branch.bom.csv && diff out/sensor-branch.wirelist.csv examples/sensor-branch/sensor-branch.wirelist.csv
