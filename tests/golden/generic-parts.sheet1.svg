<text x="42.0" y="1004.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#111" text-decoration="underline">NOTES:</text>
<text x="42.0" y="1024.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#111" xml:space="preserve">1.  FABRICATE, INSPECT AND TEST PER IPC/WHMA-A-620, CLASS 2.</text>
<text x="42.0" y="1039.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#111" xml:space="preserve">2.  ALL DIMENSIONS IN MM. LENGTHS ARE MEASURED FROM CONNECTOR REAR FACE TO BREAKOUT CENTRE OR TO THE NEXT CONNECTOR REAR FACE.</text>
<text x="42.0" y="1054.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#111" xml:space="preserve">3.  LENGTH TOLERANCES UNLESS OTHERWISE SPECIFIED: ≤300: ±5, ≤1000: ±10, over: ±1%. SEGMENT DIMENSIONS GOVERN; OVERALL DIMENSIONS ARE REFERENCE.</text>
<text x="42.0" y="1069.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#111" xml:space="preserve">4.  DRAWING NOT TO SCALE. WIRE CUT LENGTHS PER WIRE LIST; CONNECTIONS PER CONNECTOR TABLES AND WIRING DIAGRAM.</text>
<text x="42.0" y="1084.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#111" xml:space="preserve">5.  CONTINUITY-TEST 100% AGAINST THE WIRE LIST; NO SHORTS BETWEEN NETS.</text>
