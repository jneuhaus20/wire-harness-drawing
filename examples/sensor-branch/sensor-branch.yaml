# Example harness: one DE-9 controller plug fanning out to three device plugs and a ground lug.
drawing:
  title: SENSOR BRANCH HARNESS
  number: EX-0001
  rev: A
  units: mm
  drawn_by: CLAUDE
  date: 2026-11-19
  ipc_class: 2
  datum: connector rear face
  tolerance: [{upto: 300, tol: 5}, {upto: 1000, tol: 10}, {upto: null, tol: "1%"}]
  round_to: 5
  extra_per_wire: 20          # service/strip allowance added to every cut length
  wire_type: UL1007 hook-up wire

connectors:
  P1:
    label: TO CONTROLLER
    type: DE-9
    subtype: plug, male, solder cup
    pn: 5-747904-2
    manufacturer: TE
    pincount: 9
    pinlabels: [GND, +5V, SCL, SDA, MISO, MOSI, SCK, SHLD, NC]
    gender: male
    # contact positions in mm, mating face: 2.77 mm along a row, 2.84 mm between rows (KiCad DSUB-9_Pins_Vertical)
    face: {view: mating face, cavities: {1: [0, 0], 2: [2.77, 0], 3: [5.54, 0], 4: [8.31, 0], 5: [11.08, 0],
                                         6: [1.385, 2.84], 7: [4.155, 2.84], 8: [6.925, 2.84], 9: [9.695, 2.84]}}
    accessories: [{desc: "Cable clamp kit, DE-9, zinc, 4-40, 9.4 mm max", pn: 5745171-5, manufacturer: TE}]
    # with its cable clamp: flange 30.8 wide (TE drawing C-747904), clamp 1.910 in long, 0.620 in thick (TE drawing C-5745171),
    # nickel-plated zinc; 6.1 mm of D-shell beyond the flange
    body: {shape: dsub, length: 54.6, width: 30.8, height: 15.7, color: nickel}
    awg: [20, 28]          # TE states 20 AWG maximum for the solder cup and no minimum; 28 is this drawing's floor
  J1:
    label: SENSOR A
    type: KK 254
    subtype: female 4-pin
    pn: 22-01-3047
    manufacturer: Molex
    pincount: 4
    pinlabels: [GND, +5V, SCL, SDA]
    gender: female
    face: {grid: [1, 4], view: mating face}
    contact: {desc: "KK 254 crimp, 22-30 AWG", pn: 08-50-0114, manufacturer: Molex}
    body: {model: meshes/22-01-3047.json, rotate: [90, 0, 90], shape: box, length: 12.7, width: 10.72, height: 6.63, color: natural}   # envelope measured from Molex's 3D model; natural nylon
    strip: 3
    awg: [22, 30]
  J2:
    label: SENSOR B
    type: KK 254
    subtype: female 4-pin
    pn: 22-01-3047
    manufacturer: Molex
    pincount: 4
    pinlabels: [GND, +5V, SCL, SDA]
    gender: female
    face: {grid: [1, 4], view: mating face}
    contact: {desc: "KK 254 crimp, 22-30 AWG", pn: 08-50-0114, manufacturer: Molex}
    body: {model: meshes/22-01-3047.json, rotate: [90, 0, 90], shape: box, length: 12.7, width: 10.72, height: 6.63, color: natural}   # envelope measured from Molex's 3D model; natural nylon
    strip: 3
  J3:
    label: SPI DEVICE
    type: KK 254
    subtype: female 5-pin
    pn: 22-01-3057
    manufacturer: Molex
    pincount: 5
    pinlabels: [GND, +5V, MISO, MOSI, SCK]
    gender: female
    face: {grid: [1, 5], view: mating face}
    contact: {desc: "KK 254 crimp, 22-30 AWG", pn: 08-50-0114, manufacturer: Molex}
    body: {model: meshes/22-01-3057.json, rotate: [90, 0, 90], shape: box, length: 12.7, width: 13.26, height: 6.63, color: natural}   # envelope measured from Molex's 3D model; natural nylon
    strip: 3
  E1:
    label: CHASSIS GND
    type: Ring lug
    subtype: "#6 stud, vinyl insulated, 22-18 AWG"
    pn: PV18-6R-CY
    manufacturer: Panduit
    strip: 8
    awg: [18, 22]
    pincount: 1
    pinlabels: [SHLD]
  SP1:
    type: splice
    desc: "MiniSeal sealed crimp splice, 2 or 3 wires to 1"
    pn: D-436-52
    manufacturer: TE
    awg: [16, 24]          # one wire 20-16 AWG, two 24-20 AWG, three 24-22 AWG per the TE drawing
  SP2:
    type: splice
    desc: "MiniSeal sealed crimp splice, 2 or 3 wires to 1"
    pn: D-436-52
    manufacturer: TE
    awg: [16, 24]          # one wire 20-16 AWG, two 24-20 AWG, three 24-22 AWG per the TE drawing
  SP3:
    type: splice
    desc: "MiniSeal sealed crimp splice, 2 or 3 wires to 1"
    pn: D-436-52
    manufacturer: TE
    awg: [16, 24]          # one wire 20-16 AWG, two 24-20 AWG, three 24-22 AWG per the TE drawing
  SP4:
    type: splice
    desc: "MiniSeal sealed crimp splice, 2 or 3 wires to 1"
    pn: D-436-52
    manufacturer: TE
    awg: [16, 24]          # one wire 20-16 AWG, two 24-20 AWG, three 24-22 AWG per the TE drawing

wires:
  - {id: W1,  from: P1:1, to: SP1,  signal: GND,  gauge: 20 AWG, color: BK}
  - {id: W2,  from: SP1,  to: J1:1, signal: GND,  gauge: 24 AWG, color: BK}
  - {id: W3,  from: SP1,  to: J2:1, signal: GND,  gauge: 24 AWG, color: BK}
  - {id: W4,  from: SP1,  to: J3:1, signal: GND,  gauge: 24 AWG, color: BK}
  - {id: W5,  from: P1:2, to: SP2,  signal: +5V,  gauge: 20 AWG, color: RD}
  - {id: W6,  from: SP2,  to: J1:2, signal: +5V,  gauge: 24 AWG, color: RD}
  - {id: W7,  from: SP2,  to: J2:2, signal: +5V,  gauge: 24 AWG, color: RD}
  - {id: W8,  from: P1:3, to: SP3,  signal: SCL,  gauge: 20 AWG, color: YE}
  - {id: W9,  from: P1:4, to: SP4,  signal: SDA,  gauge: 20 AWG, color: GN}
  - {id: W10, from: P1:5, to: J3:3, signal: MISO, gauge: 24 AWG, color: BU}
  - {id: W11, from: P1:6, to: J3:4, signal: MOSI, gauge: 24 AWG, color: OG}
  - {id: W12, from: P1:7, to: J3:5, signal: SCK,  gauge: 24 AWG, color: VT}
  - {id: W13, from: P1:8, to: E1,   signal: SHLD, gauge: 22 AWG, color: GNYE}
  - {id: W14, from: SP3,  to: J1:3, signal: SCL,  gauge: 24 AWG, color: YE}
  - {id: W15, from: SP3,  to: J2:3, signal: SCL,  gauge: 24 AWG, color: YE}
  - {id: W16, from: SP4,  to: J1:4, signal: SDA,  gauge: 24 AWG, color: GN}
  - {id: W17, from: SP4,  to: J2:4, signal: SDA,  gauge: 24 AWG, color: GN}
  - {id: W18, from: SP2,  to: J3:2, signal: +5V,  gauge: 24 AWG, color: RD}

layout:
  root: P1
  segments:                    # from, to, length (mm, datum to breakout centre / datum)
    - [P1, B1, 300]
    - [B1, E1, 150]
    - [B1, SP1, 40]
    - [SP1, SP2, 20]
    - [SP2, SP3, 20]
    - [SP3, SP4, 20]
    - [SP4, B2, 160]
    - [B2, J1, 250]
    - [B2, B3, 180]
    - [B3, J2, 120]
    - [B3, J3, 350]
  coverings:
    - {item: SLV1, segments: [P1-B1, B1-SP1, SP1-SP2, SP2-SP3, SP3-SP4, SP4-B2]}
  labels:
    - {at: P1, text: "P1 CTRL", distance: 50, item: LBL}
    - {at: J1, text: "J1 SNS-A", distance: 50, item: LBL}
    - {at: J2, text: "J2 SNS-B", distance: 50, item: LBL}
    - {at: J3, text: "J3 SPI", distance: 50, item: LBL}

items:
  - {id: SLV1, desc: "Expandable braided sleeving, PET, 6 mm", pn: PTN0.25BK, manufacturer: Techflex, qty: AR, unit: m}
  - {id: LBL,  desc: "Marker sleeve, HX-SCE, white, size to bundle", manufacturer: TE, qty: 4}
  - {id: HS1,  desc: "Heat-shrink 3:1, 6 mm, at breakouts", qty: AR, unit: m}

expect:
  nets:
    GND:  [P1:1, J1:1, J2:1, J3:1]
    +5V:  [P1:2, J1:2, J2:2, J3:2]
    SCL:  [P1:3, J1:3, J2:3]
    SDA:  [P1:4, J1:4, J2:4]
    MISO: [P1:5, J3:3]
    MOSI: [P1:6, J3:4]
    SCK:  [P1:7, J3:5]
    SHLD: [P1:8, E1:1]
